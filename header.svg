<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">

   <!-- Greeting text -->
  <text x="400" y="230" font-family="Segoe UI, Verdana, sans-serif" font-size="30"
        font-weight="600" text-anchor="middle" fill="#ffffff">
    Hi, Eng. Wilbroad Mark
  </text>
  <text x="400" y="270" font-family="Segoe UI, Verdana, sans-serif" font-size="22"
        font-weight="400" text-anchor="middle" fill="#a8dadc">
    Software Engineer | Tanzania
  </text>

  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7971e"/>
      <stop offset="100%" stop-color="#ffd200"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" fill="url(#bgGrad)" rx="14"/>

 

  <!-- Road -->
  <rect x="0" y="130" width="800" height="40" fill="#1a1a1a"/>
  <rect x="0" y="148" width="800" height="4" fill="#555"/>

  <!-- Lane dashes moving -->
  <g fill="#f4d35e">
    <rect x="0" y="148" width="30" height="4">
      <animate attributeName="x" from="0" to="-800" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="100" y="148" width="30" height="4">
      <animate attributeName="x" from="100" to="-700" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="148" width="30" height="4">
      <animate attributeName="x" from="200" to="-600" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="148" width="30" height="4">
      <animate attributeName="x" from="300" to="-500" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="148" width="30" height="4">
      <animate attributeName="x" from="400" to="-400" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="148" width="30" height="4">
      <animate attributeName="x" from="500" to="-300" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="600" y="148" width="30" height="4">
      <animate attributeName="x" from="600" to="-200" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="148" width="30" height="4">
      <animate attributeName="x" from="700" to="-100" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="148" width="30" height="4">
      <animate attributeName="x" from="800" to="0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Car 1 (red) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                       from="-120,0" to="920,0" dur="4s" repeatCount="indefinite"/>
    <g transform="translate(0,110)">
      <rect x="0" y="10" width="90" height="24" rx="6" fill="#e63946"/>
      <rect x="14" y="-6" width="55" height="20" rx="6" fill="#e63946"/>
      <rect x="20" y="-2" width="18" height="12" fill="#a8dadc"/>
      <rect x="42" y="-2" width="18" height="12" fill="#a8dadc"/>
      <circle cx="18" cy="36" r="8" fill="#1a1a1a"/>
      <circle cx="72" cy="36" r="8" fill="#1a1a1a"/>
    </g>
  </g>

  <!-- Car 2 (blue, faster, delayed) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                       from="-120,0" to="920,0" dur="3s" begin="1s" repeatCount="indefinite"/>
    <g transform="translate(0,120)">
      <rect x="0" y="10" width="80" height="22" rx="6" fill="#1d3557"/>
      <rect x="12" y="-5" width="50" height="18" rx="6" fill="#1d3557"/>
      <rect x="18" y="-1" width="16" height="10" fill="#a8dadc"/>
      <rect x="38" y="-1" width="16" height="10" fill="#a8dadc"/>
      <circle cx="16" cy="34" r="7" fill="#1a1a1a"/>
      <circle cx="64" cy="34" r="7" fill="#1a1a1a"/>
    </g>
  </g>

  <!-- Car 3 (yellow, slower, more delay) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                       from="-120,0" to="920,0" dur="5s" begin="2s" repeatCount="indefinite"/>
    <g transform="translate(0,108)">
      <rect x="0" y="10" width="95" height="24" rx="6" fill="#ffd166"/>
      <rect x="16" y="-6" width="58" height="20" rx="6" fill="#ffd166"/>
      <rect x="22" y="-2" width="18" height="12" fill="#264653"/>
      <rect x="44" y="-2" width="18" height="12" fill="#264653"/>
      <circle cx="20" cy="36" r="8" fill="#1a1a1a"/>
      <circle cx="76" cy="36" r="8" fill="#1a1a1a"/>
    </g>
  </g>

 
</svg>
